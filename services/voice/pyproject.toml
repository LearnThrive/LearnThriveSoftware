[project]
name = "learnthrive-voice"
version = "0.1.0"
description = "Local speech sidecar for LearnThrive AI voice mode (development). Speech recognition and speech output behind two HTTP endpoints."
requires-python = ">=3.12,<3.14"
dependencies = [
  "faster-whisper>=1.1.0",
  "piper-tts>=1.3.0",
  "numpy>=1.26",
  "psutil>=7.2.2",
  "kokoro-onnx>=0.6.1",
]

[tool.uv]
package = false
