# The services Study Buddy needs beside the website, for development: the local language model (Ollama, on the GPU) and the
# speech sidecar. `npm run dev` starts them (scripts/dev-services.mjs) and then the website on the host, as before.
# Both listen on 127.0.0.1 only, on the addresses the website already uses by default (11434 and 8765). Never deployed.
name: learnthrive

services:
  ollama:
    image: ollama/ollama:0.35.0
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      # The models already downloaded on this machine (OLLAMA_MODELS), so nothing is fetched twice; otherwise a Docker volume.
      - ${OLLAMA_MODELS_DIR:-ollama-models}:/root/.ollama/models
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    gpus: all
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  voice:
    build: ../services/voice
    image: learnthrive-voice:dev
    # Recognition on the GPU beside the model (small.en, about 1 GB more; both fit in 8 GB), as the voice timings were measured.
    gpus: all
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ../services/voice/models:/app/models:ro
      - whisper-cache:/root/.cache/huggingface
    environment:
      VOICE_TOKEN: ${VOICE_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      # The first start downloads the recognition model (about 150 MB) and loads both models.
      start_period: 300s
    restart: unless-stopped

volumes:
  ollama-models:
  whisper-cache:
