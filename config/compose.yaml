# The services LearnThrive AI needs beside the website, for development: the speech sidecar, web search (SearXNG) and the page reader
# (Crawl4AI). `npm run dev` starts them (scripts/dev-services.mjs) and then the website on the host. There is no model server here: the tutor
# (Reflection's Beam) runs on Ollama Cloud. They listen on 127.0.0.1 only. Never deployed.
name: learnthrive

services:
  voice:
    build: ../services/voice
    image: learnthrive-voice:dev
    # Kokoro 82M speaks on this container's CPU. Recognition is Parakeet CTC 1.1B, which is a NATIVE Windows program (NeMo-Speech.cpp,
    # set up by docs/VOICE.md) and cannot run in here: the container talks to the runtime started on the host by `npm run dev`
    # (scripts/parakeet-local.mjs) at host.docker.internal. With no host runtime it falls back to faster-whisper on the GPU and says
    # so in /health; VOICE_FALLBACK_ENABLED=false makes that a hard failure instead.
    gpus: all
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ../services/voice/models:/app/models:ro
      - whisper-cache:/root/.cache/huggingface
    environment:
      VOICE_TOKEN: ${VOICE_TOKEN:-}
      VOICE_STT_ENGINE: ${VOICE_STT_ENGINE:-parakeet}
      VOICE_PARAKEET_URL: ${VOICE_PARAKEET_URL:-http://host.docker.internal:8791}
      VOICE_TTS_ENGINE: ${VOICE_TTS_ENGINE:-kokoro}
      VOICE_TTS_VOICE: ${VOICE_TTS_VOICE:-bf_emma}
      VOICE_FALLBACK_ENABLED: ${VOICE_FALLBACK_ENABLED:-true}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      # The first start downloads the Whisper model (about 150 MB) when it is the fallback, and loads the voices.
      start_period: 300s
    restart: unless-stopped

  # Web research for LearnThrive AI (docs/RESEARCH.md). Always started with the other services; the website looks for it on 127.0.0.1:8888.
  # The secret below is a development value, safe only because the port is published on 127.0.0.1. Set SEARXNG_SECRET if that ever changes.
  searxng:
    # Pin a released tag before relying on it (SEARXNG_IMAGE), and read its release notes before upgrading.
    image: ${SEARXNG_IMAGE:-searxng/searxng:latest}
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-learnthrive-development-only-searxng-secret}
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Page extraction for LearnThrive AI (docs/RESEARCH.md): Crawl4AI, the open-source self-hosted browser crawler. SearXNG finds the pages; this
  # reads them in a real browser so pages built with JavaScript come back as readable text. CPU only (no GPU, nothing shared with Ollama).
  # It needs about 4 GB of memory while crawling. The token below is a development value, safe only because the port is published on
  # 127.0.0.1; set CRAWL4AI_API_TOKEN to a long random value anywhere else (the website refuses to use the development one in production).
  crawl4ai:
    image: ${CRAWL4AI_IMAGE:-unclecode/crawl4ai:0.9.2}
    ports:
      - "127.0.0.1:11235:11235"
    shm_size: 1g
    mem_limit: 4g
    cpus: 2
    security_opt:
      - no-new-privileges:true
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-learnthrive-development-only-crawl4ai-token}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:11235/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

volumes:
  whisper-cache:
